spring:
  application:
    name: order-management-modulith

  datasource:
    url: jdbc:postgresql://localhost:5432/modulith_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Messaging mode: spring or kafka
messaging:
  mode: spring

# Temporal configuration
temporal:
  service-address: localhost:7233
  namespace: default
  task-queue: order-fulfillment-task-queue

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.example.modulith: DEBUG
    org.springframework.modulith: DEBUG
    io.temporal: INFO
